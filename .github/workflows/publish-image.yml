name: Publish image

# Builds, scans and publishes the two production images to GHCR:
#
#   ghcr.io/<owner>/<repo>           the runtime (API: node dist/main.js; worker: node dist/worker.js)
#   ghcr.io/<owner>/<repo>-migrate   the Dockerfile `migrate` target (prisma deploy + rbac:sync)
#
# A release is a version tag: pushing `v1.2.0` publishes both images as `1.2.0`,
# the value a church server's deploy/.env names in PAKITA_VERSION. Pushing a
# branch publishes nothing.
#
# The publish job DEPLOYS NOTHING and holds no server credential: each church's
# server pulls the images (deploy/update.sh). apps/api/docs/deployment/README.md
# is the contract a deployment follows.
#
# Publishing is OPT-IN through the repository variable PUBLISH_ENABLED=true, so a
# fresh clone runs the gates and skips the push.
#
# Order matters: each image is pushed under its immutable `sha-<commit>` tag, and
# the runtime is scanned by digest before either is attested or given the moving
# version tag. A runtime that fails the scan has no attestation, so a deployment
# that verifies attestations refuses it. (The migrate image's scan reports and does not block; see below.)
#
# Unlike this repository's other workflows, every action here is pinned by commit
# SHA: this job holds packages: write and signs the provenance a deployment trusts,
# so a moved tag would let someone else's code sign images as this workflow.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # `workflow_dispatch` accepts any ref; only a version tag that matches every
  # package's version publishes.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse anything but a version tag on main matching the packages
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v[0-9]*) version="${REF#refs/tags/v}" ;;
            *) echo "::error::refusing to publish from '${REF}'; only version tags (v1.2.3) publish."; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$REF is not on main; releases come from main."
            exit 1
          }
          for manifest in package.json apps/api/package.json apps/desktop/package.json; do
            declared="$(node -p "require('./$manifest').version")"
            if [ "$declared" != "$version" ]; then
              echo "::error::$manifest says $declared, the tag says $version."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: guard
    uses: ./.github/workflows/api.yml

  desktop:
    name: Desktop
    needs: guard
    uses: ./.github/workflows/desktop.yml

  # Dependency advisories and the Trivy filesystem scan, called here so they gate
  # the publish and not only pull requests and the weekly cron.
  security:
    name: Security
    needs: guard
    uses: ./.github/workflows/security.yml

  publish:
    name: Build, scan and publish
    needs: [guard, test, desktop, security]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # The pushed digests, for a deploy job that `needs: publish`: deploy by digest.
    outputs:
      image: ${{ steps.name.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
      migrate-image: ${{ steps.name.outputs.migrate }}@${{ steps.migrate.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the images
        id: name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "runtime=$image" >> "$GITHUB_OUTPUT"
          echo "migrate=$image-migrate" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the runtime (immutable tag only)
        id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          pull: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.name.outputs.runtime }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migrate image (immutable tag only)
        id: migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          pull: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.name.outputs.migrate }}:sha-${{ github.sha }}
          cache-from: type=gha

      # The runtime serves traffic: HIGH or CRITICAL blocks the publish, as in
      # api.yml's image scan. Same exact-version pin as there, for the same reason.
      - name: Scan the runtime digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ${{ steps.name.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: 'apps/api/.trivyignore'

      # The migrate image is the build stage: the full dev toolchain, run for
      # seconds per deploy, serving nothing. Its findings are REPORTED, not
      # blocking — a dev-only advisory must not stop a release. Read them.
      - name: Scan the migrate digest (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ${{ steps.name.outputs.migrate }}@${{ steps.migrate.outputs.digest }}
          format: table
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: 'apps/api/.trivyignore'

      - name: Attest the runtime
        # Attestations need a public repository, or a GitHub plan that supports them for
        # private ones; set ATTEST_PROVENANCE=true on such a plan. Without one, the
        # image is published unattested.
        if: ${{ github.event.repository.visibility == 'public' || vars.ATTEST_PROVENANCE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.runtime }}
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true

      - name: Attest the migrate image
        # Attestations need a public repository, or a GitHub plan that supports them for
        # private ones; set ATTEST_PROVENANCE=true on such a plan. Without one, the
        # image is published unattested.
        if: ${{ github.event.repository.visibility == 'public' || vars.ATTEST_PROVENANCE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.migrate }}
          subject-digest: ${{ steps.migrate.outputs.digest }}
          push-to-registry: true

      - name: Tag the version
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          RUNTIME: ${{ steps.name.outputs.runtime }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          MIGRATE: ${{ steps.name.outputs.migrate }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
        # Migrate first: a deployment that reads the runtime tag then derives the migrate
        # image from the same tag, so the pair is never runtime-new, migrate-old.
        run: |
          docker buildx imagetools create --tag "$MIGRATE:$VERSION" "$MIGRATE@$MIGRATE_DIGEST"
          docker buildx imagetools create --tag "$RUNTIME:$VERSION" "$RUNTIME@$RUNTIME_DIGEST"

      - name: Summary
        env:
          RUNTIME: ${{ steps.name.outputs.runtime }}@${{ steps.runtime.outputs.digest }}
          MIGRATE: ${{ steps.name.outputs.migrate }}@${{ steps.migrate.outputs.digest }}
        run: |
          {
            echo "Published (\`:${{ needs.guard.outputs.version }}\`):"
            echo "- runtime: \`$RUNTIME\`"
            echo "- migrate: \`$MIGRATE\`"
          } >> "$GITHUB_STEP_SUMMARY"
