# `pnpm package:dir` builds an unpacked app to prove packaging works;
# `pnpm package:release` builds the installers into release/, which the
# desktop-release workflow attaches to a DRAFT GitHub release.
# The app icon is build/icon.png; macOS uses build/icon-mac.png, the same mark
# on Apple's icon grid (`pnpm generate:mac-icon` derives it). Installers are not code-signed yet: operating
# systems warn on first launch (see the deployment guide).
appId: io.github.jaylordibe.pakita
productName: Pakita
copyright: Copyright © 2026 Jay Lord Ibe
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# The bundled fonts' licences (SIL Open Font License 1.1) travel with them.
extraResources:
  - from: node_modules/@fontsource/inter/LICENSE
    to: licenses/fonts/Inter.txt
  - from: node_modules/@fontsource/merriweather/LICENSE
    to: licenses/fonts/Merriweather.txt
  - from: node_modules/@fontsource/nunito/LICENSE
    to: licenses/fonts/Nunito.txt
  - from: node_modules/@fontsource/oswald/LICENSE
    to: licenses/fonts/Oswald.txt
# better-sqlite3 ships prebuilt Node-API binaries for every platform, which
# load in Electron as they are: nothing needs compiling at packaging.
npmRebuild: false
# better-sqlite3's native addon cannot load from inside the asar archive.
asarUnpack:
  - '**/*.node'
# Electron Fuses, flipped in the packaged binary itself so no command-line
# flag or environment variable can turn them back on.
electronFuses:
  # The app binary must never act as a plain Node.js interpreter.
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Load the app only from its (integrity-checked) asar archive.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
  # Nothing is served from file://; the renderer uses app://.
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses edits the binary, which breaks Electron's ad-hoc macOS
  # signature, and Apple Silicon kills a binary with a broken signature at
  # launch. This re-applies an ad-hoc signature (no certificate, no keychain).
  resetAdHocDarwinSignature: true
artifactName: Pakita-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.productivity
  icon: build/icon-mac.png
  target:
    - target: dmg
      arch: [arm64, x64]
  # Never sign. Left unset, electron-builder searches the developer's keychain
  # and signs with whatever identity it finds. Signing is a release decision
  # (Phase 6), made with the project's own certificate, never a personal one.
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Office
  maintainer: Pakita (https://github.com/jaylordibe/pakita)
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # Stated, not derived from the package name ("@pakita/desktop").
  executableName: pakita
