<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The renderer loads nothing from the network: every request goes to the
      app's own origin, which IPC-backed data never needs. Styles allow
      'unsafe-inline' for Vue's scoped style injection during development;
      no inline script is allowed anywhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Pakita</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
