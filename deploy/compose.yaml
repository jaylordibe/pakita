# Pakita server — one machine, Docker Compose. See README.md in this folder.
#
# Every value comes from `.env` (created by install.sh from .env.example).
# Only Caddy publishes ports; the database, Redis and object storage are
# reachable on the internal network alone.
name: pakita

x-api-environment: &api-environment
  NODE_ENV: production
  SERVICE_NAME: pakita
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USER: pakita
  DB_PASSWORD: ${DB_PASSWORD:?run install.sh}
  DB_NAME: pakita
  DATABASE_URL: postgresql://pakita:${DB_PASSWORD}@postgres:5432/pakita?schema=public
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ${REDIS_PASSWORD:?run install.sh}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?run install.sh}
  API_BASE_URL: https://${PAKITA_DOMAIN:?set PAKITA_DOMAIN}
  CORS_ORIGIN: https://${PAKITA_DOMAIN}
  # Caddy is the only hop in front of the API: trust exactly its address.
  TRUST_PROXY: ${PAKITA_PROXY_ADDRESS:-172.31.250.2}
  STORAGE_PROVIDER: s3
  STORAGE_S3_ENDPOINT: http://storage:9000
  STORAGE_S3_FORCE_PATH_STYLE: 'true'
  STORAGE_S3_BUCKET: pakita
  STORAGE_S3_REGION: us-east-1
  AWS_ACCESS_KEY_ID: pakita
  AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?run install.sh}

x-pakita-image: &pakita-image ghcr.io/jaylordibe/pakita:${PAKITA_VERSION:?set PAKITA_VERSION}

services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      PAKITA_DOMAIN: ${PAKITA_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    networks:
      edge:
        ipv4_address: ${PAKITA_PROXY_ADDRESS:-172.31.250.2}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    image: *pakita-image
    restart: unless-stopped
    environment:
      <<: *api-environment
      QUEUE_WORKER_ENABLED: 'false'
      PORT: '3000'
    networks:
      - default
      - edge
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/liveness').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  worker:
    image: *pakita-image
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-environment
      QUEUE_WORKER_ENABLED: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Applies database migrations and the permission catalog, then exits. Every
  # start runs it first, so an update migrates before the new API serves.
  migrate:
    image: ghcr.io/jaylordibe/pakita-migrate:${PAKITA_VERSION}
    restart: 'no'
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.3
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: pakita
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pakita
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --locale=C.UTF-8'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pakita -d pakita']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.6.2
    restart: unless-stopped
    # The password goes into a config file, not the command line, so it never
    # shows in a process listing.
    entrypoint: ['sh', '-c']
    command:
      - >-
        printf 'requirepass %s\nappendonly yes\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        && exec redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for uploaded files.
  storage:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: pakita
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket once (idempotent), then exits.
  storage-init:
    image: amazon/aws-cli:2.39.2
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: pakita
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['sh', '-c']
    command:
      - >-
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket pakita
        || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket pakita
    depends_on:
      storage:
        condition: service_healthy

networks:
  default:
  # Caddy and the API only. Caddy's fixed address lies outside the range
  # handed out automatically, so nothing else can take it. Change the three
  # PAKITA_EDGE_* / PAKITA_PROXY_ADDRESS values together if this range is in
  # use on the machine.
  edge:
    ipam:
      config:
        - subnet: ${PAKITA_EDGE_SUBNET:-172.31.250.0/28}
          ip_range: ${PAKITA_EDGE_DYNAMIC_RANGE:-172.31.250.8/29}

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  storage-data:
