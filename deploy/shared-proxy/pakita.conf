# Pakita behind an existing nginx (../shared-server.md). Replace
# pakita.example.org, and point the certificate lines at this domain's
# certificate, obtained the way this nginx's other sites get theirs.

server {
    listen 80;
    server_name pakita.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pakita.example.org;

    ssl_certificate     /etc/nginx/certs/pakita.example.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/pakita.example.org/privkey.pem;

    # Docker's own DNS, looked up per request: nginx starts, and keeps
    # serving the other sites, while Pakita is down or not installed yet.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $pakita_api http://pakita-api:3000;

    # The largest request through the API: a 20 MB background image.
    client_max_body_size 26m;

    location / {
        proxy_pass $pakita_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Only with PAKITA_STORAGE=s3 (files kept on this machine). Laptops upload
    # and download background videos straight to the bucket with links the
    # API signed, so: the Host header and path pass unchanged (the signature
    # covers them), bodies up to 1 GB stream through unbuffered, and nothing
    # is compressed, so byte ranges stay byte ranges. With
    # PAKITA_STORAGE=gcs, delete this block.
    location /pakita/ {
        set $pakita_storage http://pakita-storage:9000;
        proxy_pass $pakita_storage;
        proxy_set_header Host $host;
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_buffering off;
        gzip off;
    }
}
